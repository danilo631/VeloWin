name: VeloWin Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velowin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate independent app and release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pure Java policy regression tests
        run: |
          mkdir -p /tmp/velowin-tests
          javac -encoding UTF-8 -d /tmp/velowin-tests \
            app/src/main/java/dev/velowin/app/runtime/ReleasePolicy.java \
            tests/ReleasePolicyTest.java
          java -ea -cp /tmp/velowin-tests ReleasePolicyTest
      - name: Static Android source contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  apk:
    name: Build original VeloWin APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velowin-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
