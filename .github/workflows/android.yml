name: VeloWin Android

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velowin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate independent app and release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pure Java policy regression tests
        run: |
          mkdir -p /tmp/velowin-tests
          javac -encoding UTF-8 -d /tmp/velowin-tests \
            app/src/main/java/dev/velowin/app/runtime/ReleasePolicy.java \
            app/src/main/java/dev/velowin/app/runtime/ArchiveSafety.java \
            app/src/main/java/dev/velowin/app/runtime/ElfVerifier.java \
            app/src/main/java/dev/velowin/app/library/PeInspector.java \
            app/src/main/java/dev/velowin/app/engine/RuntimeStrategy.java \
            app/src/main/java/dev/velowin/app/engine/SmartProfile.java \
            app/src/main/java/dev/velowin/app/engine/Box64Tuning.java \
            app/src/main/java/dev/velowin/app/engine/BoundedProcess.java \
            app/src/main/java/dev/velowin/app/engine/WineRuntimeAudit.java \
            app/src/main/java/dev/velowin/app/engine/WineLaunchEnvironment.java \
            app/src/main/java/dev/velowin/app/engine/FailureClassifier.java \
            app/src/main/java/dev/velowin/app/engine/EngineReadiness.java \
            app/src/main/java/dev/velowin/app/engine/BionicSessionPlan.java \
            app/src/main/java/dev/velowin/app/engine/GameRuntimeChoice.java \
            app/src/main/java/dev/velowin/app/engine/PrefixLinkPolicy.java \
            app/src/main/java/dev/velowin/app/engine/PrefixArchivePath.java \
            app/src/main/java/dev/velowin/app/engine/GameSessionConfig.java \
            app/src/main/java/dev/velowin/app/engine/ContainerCommand.java \
            app/src/main/java/dev/velowin/app/engine/ContainerFileBrowser.java \
            app/src/main/java/dev/velowin/app/engine/BridgeProfile.java \
            app/src/main/java/dev/velowin/app/engine/X11Protocol.java \
            app/src/main/java/dev/velowin/app/engine/Win32ProbeVerdict.java \
            app/src/main/java/dev/velowin/app/engine/ControllerState.java \
            app/src/main/java/dev/velowin/app/hardware/GpuDriverPolicy.java \
            app/src/main/java/dev/velowin/app/runtime/BionicReleasePolicy.java \
            tests/ReleasePolicyTest.java \
            tests/ArchiveSafetyTest.java \
            tests/ElfVerifierTest.java \
            tests/PeInspectorTest.java \
            tests/RuntimeStrategyTest.java \
            tests/SmartProfileTest.java \
            tests/Box64TuningTest.java \
            tests/BoundedProcessTest.java \
            tests/WineRuntimeAuditTest.java \
            tests/WineLaunchEnvironmentTest.java \
            tests/FailureClassifierTest.java \
            tests/EngineReadinessTest.java \
            tests/BionicSessionPlanTest.java \
            tests/GameRuntimeChoiceTest.java \
            tests/PrefixLinkPolicyTest.java \
            tests/PrefixArchivePathTest.java \
            tests/GameSessionConfigTest.java \
            tests/ContainerCommandTest.java \
            tests/ContainerFileBrowserTest.java \
            app/src/main/java/dev/velowin/app/runtime/ComponentRelease.java \
            app/src/main/java/dev/velowin/app/runtime/ComponentReleasePolicy.java \
            tests/ComponentReleasePolicyTest.java \
            tests/BridgeProfileTest.java \
            tests/X11ProtocolTest.java \
            tests/Win32ProbeVerdictTest.java \
            tests/ControllerStateTest.java \
            tests/GpuDriverPolicyTest.java \
            tests/BionicReleasePolicyTest.java
          java -ea -cp /tmp/velowin-tests ReleasePolicyTest
          java -ea -cp /tmp/velowin-tests ArchiveSafetyTest
          java -ea -cp /tmp/velowin-tests ElfVerifierTest
          java -ea -cp /tmp/velowin-tests PeInspectorTest
          java -ea -cp /tmp/velowin-tests RuntimeStrategyTest
          java -ea -cp /tmp/velowin-tests SmartProfileTest
          java -ea -cp /tmp/velowin-tests Box64TuningTest
          java -ea -cp /tmp/velowin-tests BoundedProcessTest
          java -ea -cp /tmp/velowin-tests WineRuntimeAuditTest
          java -ea -cp /tmp/velowin-tests WineLaunchEnvironmentTest
          java -ea -cp /tmp/velowin-tests FailureClassifierTest
          java -ea -cp /tmp/velowin-tests EngineReadinessTest
          java -ea -cp /tmp/velowin-tests BionicSessionPlanTest
          java -ea -cp /tmp/velowin-tests GameRuntimeChoiceTest
          java -ea -cp /tmp/velowin-tests PrefixLinkPolicyTest
          java -ea -cp /tmp/velowin-tests PrefixArchivePathTest
          java -ea -cp /tmp/velowin-tests GameSessionConfigTest
          java -ea -cp /tmp/velowin-tests ContainerCommandTest
          java -ea -cp /tmp/velowin-tests ContainerFileBrowserTest
          java -ea -cp /tmp/velowin-tests ComponentReleasePolicyTest
          java -ea -cp /tmp/velowin-tests BridgeProfileTest
          java -ea -cp /tmp/velowin-tests X11ProtocolTest
          java -ea -cp /tmp/velowin-tests Win32ProbeVerdictTest
          java -ea -cp /tmp/velowin-tests ControllerStateTest
          java -ea -cp /tmp/velowin-tests GpuDriverPolicyTest
          java -ea -cp /tmp/velowin-tests BionicReleasePolicyTest
      - name: Static Android source contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  apk:
    name: Build original VeloWin APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Install native Box64 cross-compile tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build file gcc-mingw-w64-x86-64
      - name: Download pinned Box64 Bionic source
        run: |
          git clone -q https://github.com/ptitSeb/box64.git /tmp/box64-src
          cd /tmp/box64-src
          git checkout -q c6a8c4472f74f9ad204d35195f084b5f996b12e3
          test "$(git rev-parse HEAD)" = "c6a8c4472f74f9ad204d35195f084b5f996b12e3"
          test -s LICENSE
      - name: Compile Box64 for Android ARM64 Bionic
        run: |
          export NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S /tmp/box64-src -B /tmp/box64-build -G Ninja \
            -DCMAKE_C_COMPILER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" \
            -DANDROID=ON -DARM64=ON -DTERMUX=OFF -DARM_DYNAREC=ON \
            -DBAD_SIGNAL=ON -DHAVE_TRACE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/box64-build --parallel 4
          test -s /tmp/box64-build/box64
      - name: Audit Box64 Bionic architecture and package as ARM64
        run: |
          set -euo pipefail
          export LLVM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$LLVM/llvm-readelf" -h /tmp/box64-build/box64 | tee /tmp/velowin-box64-audit.txt
          "$LLVM/llvm-readelf" -l /tmp/box64-build/box64 | tee -a /tmp/velowin-box64-audit.txt
          "$LLVM/llvm-readelf" -d /tmp/box64-build/box64 | tee -a /tmp/velowin-box64-audit.txt
          grep -Eq 'Machine:.*AArch64' /tmp/velowin-box64-audit.txt
          grep -Fq '/system/bin/linker64' /tmp/velowin-box64-audit.txt
          grep -Eq 'Shared library:.*libc.so' /tmp/velowin-box64-audit.txt
          ! grep -Fq 'ld-linux-aarch64.so.1' /tmp/velowin-box64-audit.txt
          "$LLVM/llvm-strip" /tmp/box64-build/box64
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/box64-build/box64 app/src/main/jniLibs/arm64-v8a/libvelobox64.so
          cp /tmp/box64-src/LICENSE /tmp/velowin-Box64-LICENSE.txt
          echo "Box64 source commit: c6a8c4472f74f9ad204d35195f084b5f996b12e3" >> /tmp/velowin-box64-audit.txt
          sha256sum app/src/main/jniLibs/arm64-v8a/libvelobox64.so | tee -a /tmp/velowin-box64-audit.txt
      - name: Build trusted Win32 console smoke program for Wine Bionic
        run: |
          set -euo pipefail
          x86_64-w64-mingw32-gcc -O2 -s -static-libgcc \
            -o app/src/main/assets/velowin-smoke.exe tests/win32/velowin_smoke.c
          file app/src/main/assets/velowin-smoke.exe
          file app/src/main/assets/velowin-smoke.exe | grep -Eq 'PE32\+.*x86-64'
          sha256sum app/src/main/assets/velowin-smoke.exe | tee /tmp/velowin-win32-smoke-sha.txt
      - name: Assemble Box64-enabled primary debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm APK contains executable Box64
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libvelobox64.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libvelowin_probe.so'
          unzip -l "$APK" | grep -F 'assets/velowin-smoke.exe'
          unzip -p "$APK" lib/arm64-v8a/libvelobox64.so | sha256sum
      - name: Upload Box64 audit
        uses: actions/upload-artifact@v4
        with:
          name: velowin-v08-bionic-elf-audit
          path: |
            /tmp/velowin-box64-audit.txt
            /tmp/velowin-Box64-LICENSE.txt
            /tmp/velowin-win32-smoke-sha.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velowin-v08-bionic-bridge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
