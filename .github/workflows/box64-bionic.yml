name: Experimental Box64 Bionic Integration

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/engine-launcher-and-ux-v035']
    paths:
      - '.github/workflows/box64-bionic.yml'
      - 'app/src/main/java/dev/velowin/app/engine/**'
      - 'docs/BIONIC.md'

permissions:
  contents: read

jobs:
  bionic-box64:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android NDK and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build file
      - name: Download reviewed upstream Box64 commit
        run: |
          git clone -q https://github.com/ptitSeb/box64.git /tmp/box64-src
          cd /tmp/box64-src
          git checkout -q c6a8c4472f74f9ad204d35195f084b5f996b12e3
          test "$(git rev-parse HEAD)" = "c6a8c4472f74f9ad204d35195f084b5f996b12e3"
      - name: Cross-compile Bionic Box64 ARM64 (experimental)
        run: |
          export NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S /tmp/box64-src -B /tmp/box64-build -G Ninja \
            -DCMAKE_C_COMPILER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" \
            -DANDROID=ON -DARM64=ON -DTERMUX=OFF -DARM_DYNAREC=ON \
            -DBAD_SIGNAL=ON -DHAVE_TRACE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/box64-build --parallel 4
          test -s /tmp/box64-build/box64
      - name: Validate ELF architecture and Bionic dependencies
        run: |
          export LLVM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$LLVM/llvm-readelf" -h /tmp/box64-build/box64 | tee /tmp/box64-elf.txt
          "$LLVM/llvm-readelf" -l /tmp/box64-build/box64 | tee -a /tmp/box64-elf.txt
          "$LLVM/llvm-readelf" -d /tmp/box64-build/box64 | tee -a /tmp/box64-elf.txt
          grep -Eq 'Machine:.*AArch64' /tmp/box64-elf.txt
          grep -Fq '/system/bin/linker64' /tmp/box64-elf.txt
          grep -Eq 'Shared library:.*libc.so' /tmp/box64-elf.txt
          ! grep -Fq 'ld-linux-aarch64.so.1' /tmp/box64-elf.txt
          "$LLVM/llvm-strip" /tmp/box64-build/box64
      - name: Embed experimental translator in separate debug APK
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/box64-build/box64 app/src/main/jniLibs/arm64-v8a/libvelobox64.so
          gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: velowin-box64-bionic-experimental
          path: |
            app/build/outputs/apk/debug/*.apk
            /tmp/box64-elf.txt
          if-no-files-found: error
          retention-days: 14
