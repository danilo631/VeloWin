name: VeloWin Native Recovery and Settings

on:
  push:
    branches: [main, feature/v14-native-clean-main, feature/v15-modular-velowin-gamehub, feature/v16-veloflow-mali-native-modules, feature/v17-runtime-backends-framepacing, feature/v18-black-screen-recovery-settings]
    paths:
      - .gitmodules
      - tools/prepare-winnative.py
      - 'overlays/velowin-app/**'
      - 'overlays/velowin-native/**'
      - tools/strip-lsfg.py
      - tools/patch-v17.py
      - tools/patch-v18.py
      - tests/VeloBootTargetTest.java
      - tests/test_v18_recovery.py
      - tests/VeloRuntimePlanTest.java
      - tests/VeloFlowPacingTest.c
      - tests/test_v17_runtime.py
      - tests/test_v16_veloflow.py
      - tests/MaliProfileTest.java
      - 'tests/stubs/**'
      - tests/test_v15_modular.py
      - tests/FrameGenPolicyTest.java
      - .github/workflows/velowin-native.yml
      - tests/test_v14_native_mixer.py
      - README.md
      - LICENSE-NATIVE.md
      - settings.gradle
      - build.gradle
      - tools/build-native.sh
      - LICENSE
      - docs/NATIVE_ENGINE_V14.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velowin-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Check upstream pin and source policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Validate complete native engine source pin
        run: |
          python3 -m py_compile tools/prepare-winnative.py tools/strip-lsfg.py tools/patch-v17.py tools/patch-v18.py
          python3 -m unittest discover -s tests -p test_v14_native_mixer.py -v
          python3 -m unittest discover -s tests -p test_v15_modular.py -v
          python3 -m unittest discover -s tests -p test_v16_veloflow.py -v
          python3 -m unittest discover -s tests -p test_v17_runtime.py -v
          python3 -m unittest discover -s tests -p test_v18_recovery.py -v
          mkdir -p /tmp/velowin-boot-test
          javac -d /tmp/velowin-boot-test \
            overlays/velowin-app/VeloBootTarget.java tests/VeloBootTargetTest.java
          java -ea -cp /tmp/velowin-boot-test VeloBootTargetTest
          mkdir -p /tmp/velowin-runtime-test
          javac -d /tmp/velowin-runtime-test \
            overlays/velowin-app/VeloRuntimePlan.java tests/VeloRuntimePlanTest.java
          java -ea -cp /tmp/velowin-runtime-test VeloRuntimePlanTest
          cc -std=c11 -Wall -Wextra -Werror -O2 tests/VeloFlowPacingTest.c \
            -lm -o /tmp/velowin-velo-pacing
          /tmp/velowin-velo-pacing
          mkdir -p /tmp/velowin-mali-test
          javac -d /tmp/velowin-mali-test \
            tests/stubs/com/winlator/cmod/runtime/container/Container.java \
            overlays/velowin-app/MaliProfile.java tests/MaliProfileTest.java
          java -ea -cp /tmp/velowin-mali-test MaliProfileTest
          mkdir -p /tmp/velowin-framegen-test
          javac -d /tmp/velowin-framegen-test \
            overlays/velowin-app/FrameGenPolicy.java tests/FrameGenPolicyTest.java
          java -ea -cp /tmp/velowin-framegen-test FrameGenPolicyTest

  native-apk:
    name: Build full XServer + Wine/Proton + Box64 VeloWin APK
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
      - name: Clone pinned engine and its real native submodules
        run: |
          set -euo pipefail
          git submodule update --init third_party/winnative
          git -C third_party/winnative submodule update --init --recursive --jobs 4
          test "$(git -C third_party/winnative rev-parse HEAD)" = "8409085f706acbc0749881d9bf1e85f2f347dfd4"
          test -s third_party/winnative/app/src/main/runtime/display/XServerDisplayActivity.java
          test -s third_party/winnative/app/src/main/runtime/display/environment/components/XServerComponent.java
          test -s third_party/winnative/app/src/main/runtime/container/ContainerManager.java
          test -s third_party/winnative/LICENSE
      - name: Restore binary assets from the engine's Git LFS store
        run: |
          set -euo pipefail
          git -C third_party/winnative lfs install --local
          git -C third_party/winnative lfs pull
          test -s third_party/winnative/app/src/main/assets/imagefs.tzst || \
            test -s third_party/winnative/app/src/main/assets/imagefs.part1.tzst
          git -C third_party/winnative lfs ls-files | head -15 || true
      - name: Set up Java 17 and Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Install Android SDK and pinned NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.3.13750724"
      - name: Set up Rust Android and native dependencies
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake file pkg-config bison flex
      - name: Prepare VeloWin branding, independent APK ID and GPL source notices
        run: |
          set -euo pipefail
          python3 tools/prepare-winnative.py --source third_party/winnative --root .
          python3 tools/strip-lsfg.py --source third_party/winnative --root .
          python3 tools/patch-v17.py --source third_party/winnative --root .
          python3 tools/patch-v18.py --source third_party/winnative
          test -s third_party/winnative/app/src/main/app/velowin/VeloSettingsActivity.java
          test -s third_party/winnative/app/src/main/app/velowin/VeloBootTarget.java
          grep -Fq "checkVeloWinFirstWindow" \
            third_party/winnative/app/src/main/runtime/display/XServerDisplayActivity.java
          # Source-level audit: only disabled ABI remains; no LSFG shader chain.
          test ! -e third_party/winnative/app/src/main/cpp/winlator/vk/lsfg/vkr_lsfg.cpp
          test -s third_party/winnative/app/src/main/cpp/winlator/vk/framegen/veloflow_compat.cpp
          test -s third_party/winnative/app/src/main/app/velowin/MaliProfile.java
          test -s third_party/winnative/app/src/main/app/velowin/VeloRuntimeBridge.java
          test -s third_party/winnative/app/src/main/cpp/winlator/vk/veloflow_pacing.h
          grep -Fq "veloflow_safe_target" \
            third_party/winnative/app/src/main/cpp/winlator/vk/vk_renderer.c
          ! grep -Eq '^[[:space:]]*winlator/vk/lsfg/.*\.(cpp|c)' \
            third_party/winnative/app/src/main/cpp/CMakeLists.txt
          test -f third_party/winnative/app/src/main/assets/velowin/legal/WinNative-LICENSE
          test -f third_party/winnative/app/src/main/assets/velowin/legal/WinNative-CREDITS.md
          test -f third_party/winnative/app/src/main/assets/velowin/legal/WinNative-EMULATOR_CREDITS.md
      - name: Assemble REAL WinNative graphical container runtime as VeloWin
        working-directory: third_party/winnative
        timeout-minutes: 120
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug --no-daemon --stacktrace --build-cache \
            -PVERSION_NAME=VeloWin-Recovery-v18-dev
      - name: Audit VeloWin identity, graphical components and license in APK
        run: |
          set -euo pipefail
          APK="third_party/winnative/app/build/outputs/apk/standard/debug/standard.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/velowin-v14-aapt.txt
          grep -F "package: name='dev.velowin.app'" /tmp/velowin-v14-aapt.txt
          grep -F "application-label:'VeloWin'" /tmp/velowin-v14-aapt.txt
          unzip -l "$APK" | tee /tmp/velowin-v14-apk-files.txt > /dev/null
          grep -F "assets/velowin/legal/WinNative-LICENSE" /tmp/velowin-v14-apk-files.txt
          grep -F "assets/velowin/legal/WinNative-CREDITS.md" /tmp/velowin-v14-apk-files.txt
          grep -F "assets/velowin/legal/VELO-WIN-NOTICE.txt" /tmp/velowin-v14-apk-files.txt
          grep -F "classes.dex" /tmp/velowin-v14-apk-files.txt
          # The APK must have exactly one original VeloWin HOME launcher.
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'com.winlator.cmod.velowin.VeloWinHomeActivity'
          test -s third_party/winnative/app/src/main/app/velowin/VeloWinHomeActivity.java
          test -s third_party/winnative/app/src/main/app/velowin/FrameGenPolicy.java
          sha256sum "$APK" | tee /tmp/velowin-v14-sha256.txt
          mkdir -p out
          cp "$APK" out/VeloWin-Native-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VeloWin-Recovery-Settings-v18-debug
          path: out/VeloWin-Native-arm64-debug.apk
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: VeloWin-Native-Licenses-BuildAudit
          path: |
            /tmp/velowin-v14-aapt.txt
            /tmp/velowin-v14-sha256.txt
            third_party/winnative/app/src/main/assets/velowin/legal/
          retention-days: 14
          if-no-files-found: error
