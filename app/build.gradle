plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.velowin.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.velowin.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            // Signed releases require the owner's signing configuration.
        }
    }
}

dependencies {
    // Intentionally uses Android framework APIs only for the independent foundation.
    // Native engines are not bundled. Commons Compress + XZ only parse Wine archives.
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
}
