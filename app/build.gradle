plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.velowin.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.velowin.app'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.6.0-dev'
    }

    ndkVersion '27.2.12479018'
    defaultConfig {
        externalNativeBuild { cmake { arguments '-DANDROID_STL=none' } }
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            // Signed releases require the owner's signing configuration.
        }
    }
}

dependencies {
    // Intentionally uses Android framework APIs only for the independent foundation.
    // Native engines are not bundled. Commons Compress + XZ only parse Wine archives.
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.github.luben:zstd-jni:1.5.7-3@aar'
}
