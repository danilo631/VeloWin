plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.velowin.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.velowin.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            // Signed releases require the owner's signing configuration.
        }
    }
}

dependencies {
    // Intentionally uses Android framework APIs only for the independent foundation.
    // Native engines and third-party components are NOT silently bundled.
}
